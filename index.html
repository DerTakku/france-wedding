<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shotlist">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Wedding Shotlist</title>
  <style>
    :root { color-scheme: light; --ink:#19312d; --paper:#f7f4ed; --accent:#b96545; --line:#ded8cd; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    main { max-width:720px; margin:auto; padding:calc(24px + env(safe-area-inset-top)) 16px 40px }
    h1 { margin:0; font:700 32px/1.05 Georgia,serif } .intro { margin:8px 0 20px; color:#53645d }
    .progress { position:sticky; top:0; z-index:2; padding:12px 0; background:var(--paper) } progress { width:100%; height:10px; accent-color:var(--accent) }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 } button { border:1px solid var(--line); background:white; color:var(--ink); border-radius:999px; padding:8px 12px; font:inherit } button.active { background:var(--ink); color:white; border-color:var(--ink) } button.reset { margin-left:auto; color:#8a3427 }
    section { margin:26px 0 } h2 { font:700 21px/1.2 Georgia,serif; margin:0 0 9px } .note { margin:0 0 10px; color:#53645d; font-size:14px }
    .shot { display:flex; align-items:flex-start; gap:11px; padding:12px 2px; border-top:1px solid var(--line); cursor:pointer } .shot input { width:21px; height:21px; margin:1px 0 0; accent-color:var(--accent); flex:none } .shot.done span { color:#78847d; text-decoration:line-through }
    .tag { display:inline-block; margin-left:6px; color:#7f4939; font-size:12px; font-weight:650; white-space:nowrap } .hidden { display:none }
  </style>
</head>
<body><main>
  <h1>Wedding Shotlist</h1><p class="intro">Lindsey &amp; Sebastian · Frankrijk · vink af terwijl je filmt.</p>
  <div class="progress"><span id="count">0 / 0</span><progress id="bar" value="0" max="1"></progress></div>
  <div class="controls" aria-label="Filters"><button class="active" data-filter="all">Alles</button><button data-filter="must">★ Must-have</button><button data-filter="25">25 fps</button><button data-filter="50">50 fps</button><button class="reset" id="reset">Reset</button></div>
  <div id="list"></div>
</main>
<script>
const groups = [
 ['Vrijdag 18 september — welkom','17:30 aankomst crew · 18:00 rondje · 19:00 welkom · 20:00 pizza · 22:00 preparty',[
  ['Domaine, wijngaarden, olijfbomen en zwembad','must,25'],['Welkomstborrel: aankomst, omhelzingen, glazen en lachende gasten','25'],['Lindsey + Sebastian samen','must,25'],['Welkomstwoord volledig opnemen','must,25'],['Pizza: oven, vuur, bereiden, serveren, tafel wide','50'],['Poolparty / avondlicht / reflecties','50'],['17:30 — Aankomst Roxanne en crew + begroeting','25'],['18:00 — Locatieronde: ceremonie, vin d’honneur, diner en feestzaal','must,25'],['18:30 — Gasten in avondkleding / laatste voorbereidingen','25'],['19:00 — Aperitiefhapjes, tafels op het gras en sfeer bij zwembad','25'],['22:00 — Borrel, snacks, muziek en kleine poolparty','50']]],
 ['Zaterdag 19 september — ochtend & getting ready','09:00 ontbijt · 10:30 details · 12:00 baguette · 13:00 getting ready · 15:30 jurk · 15:45 first look',[
  ['Ochtendlicht, koffie, ontbijt en ontspannen gasten','25'],['Ringen, jurk, schoenen, parfum, bloemen en uitnodiging','50'],['Lindsey: haar, make-up, spiegel, sieraden en reacties','50'],['Sebastian + Thijs aankleden','must,50'],['Jurk aantrekken: handen, stof, spiegel en reacties','must,50'],['First look vader: wacht, verschijning, reactie, omhelzing','must,25'],['10:30 — Zwembad, inflatables en vrije tijd','50'],['12:00 — Baguettes met lintjes en kaartjes aan het zwembad','50'],['13:00 — Bride kimono, haar en make-up met de meiden','25'],['13:15 — Mannen aan het zwembad: spikeball en games','50'],['14:30 — Sebastian: douchen impliceren, overhemd en details','25'],['15:00 — Sebastian en Thijs aankleden in de balkonkamer','must,50'],['15:15 — Ceremoniesetting clean: gangpad, bloemen, bankje, spiegel en details','must,25'],['15:45 — Gasten arriveren en worden ontvangen bij de ceremonie','25']]],
 ['Ceremonie — 16:00','15:50 Sebastian naar motor · 15:55 Kawaboys klaar · 16:00 ceremonie',[
  ['Lege ceremonieplek, stoelen, bloemen, muzikanten en gasten','25'],['Sebastian arriveert op Kawasaki + motor-audio','must,50'],['Entree Lindsey + reactie Sebastian','must,25'],['Wide master van de ceremonie','must,25'],['Geloften volledig opnemen + eigen backup','must,25'],['Handen, ouders, Thijs en emotionele gasten','25'],['Kus, dipkiss en confetti','must,50'],['15:55 — Beerboys/Kawaboys met buckets, 1664 en water','25'],['16:00 — Opening door Beerboys/Kawaboys','must,25'],['Sebastian loopt met Caroline naar de ceremonie','must,25'],['Lindsey loopt met Ton naar de ceremonie','must,25'],['Getuigen tekenen: Roxanne, Davy, Rick en Renske','must,25'],['Voorstelling als familie Van der Kuijp en ceremonie-uitloop','must,25'],['Audio: microfoonfeed BABS en geloften + recorder-back-up','must,25']]],
 ['Vin d’honneur & shoot','17:00 toost · 17:30 shoot · 18:00 spelletjes · 18:30 dinersetting',[
  ['Champagnetoren, kurk, inschenken, eerste slok','must,50'],['Croquembouche en eerste soesje','50'],['Felicitaties, omhelzingen en groepsfoto','25'],['Hand in hand door wijngaard / olijfbomen','must,50'],['Jurkbeweging, ringen, kus, silhouet en gezin','must,50'],['17:00 — Bruidspaar verlaat ceremonie voor privémoment','25'],['17:00 — Gasten lopen naar zwembad / Gzaka speelt','25'],['17:30 — Shoot begint met Lindsey, Sebastian en Thijs','must,50'],['17:30 — Franse trap, zaal en Domaine in Vogue-stijl','50'],['Indien tijd — Thijs en Spyke samen met bruidspaar','50'],['Groepscombinaties en spontane interacties met familie en vrienden','25'],['18:00 — Petanque, voetbal, tafeltennis en spikeball','50']]],
 ['Diner & feest','18:30 dinersetting · 19:00 diner · 21:45 touch-up · 22:00 feest · 23:30 Flügel',[
  ['Tafel pas filmen wanneer alle kaarsen branden','must,25'],['Priklichten, kaarsen, bloemen, menu, wijn en lange tafel','25'],['Toasts en speeches volledig opnemen','must,25'],['Limoncello: inschenken, proosten, reacties','50'],['Servetten, gezamenlijke entree en eerste dansvloer-wide','must,50'],['Dansende gezichten, handen omhoog, DJ en bouquet toss','50'],['19:00 — Gerechten, bediening, tafelmomenten en reacties','25'],['21:00 — Feestzaal clean: snoephoek, foamsticks en wegwerpcamera’s','25'],['21:45 — Touch-up, feestbrillen, champagne en Lindsey met servet','50'],['22:00 — Les Lacs de Connemara: servetten en tocht naar feestzaal','must,50'],['22:00 — Champagne-entree Sebastian, bellenblaas- en rookmachine','must,50'],['Boeketworp op aankondiging van Tygo','must,50'],['23:30 — Rondje Flügel: uitdelen, proosten en reacties','50']]],
 ['Zondag 20 september — epiloog','09:00 leveranciersontbijt · 10:30/11:00 brunch · 12:00 uitcheck · tot 17:00 zwembad',[
  ['10:30 — Brunchbuffet, menu’s en decoratie bij zwembad','must,25'],['Bruidspaar, Thijs en gasten tijdens ontspannen brunch','must,25'],['12:00 — Afscheid, omhelzingen en bedankjes bij uitcheck','must,25'],['Koffers en vertrekkende gasten','25'],['Rustige zwembadmomenten / laatste beelden van het Domaine','must,50'],['Afsluitend wide shot van Domaine, wijngaard of lege setting','must,25']]]
];
const key='france-wedding-shotlist-v1', state=JSON.parse(localStorage.getItem(key)||'{}');
const list=document.querySelector('#list');
groups.forEach(([title,note,shots],gi)=>{const s=document.createElement('section');s.innerHTML=`<h2>${title}</h2><p class="note">${note}</p>`;shots.forEach(([text,tags],si)=>{const id=`${gi}-${si}`, label=document.createElement('label');label.className='shot '+(state[id]?'done':'');label.dataset.tags=tags;label.innerHTML=`<input type="checkbox" ${state[id]?'checked':''}><span>${text}${tags.includes('must')?'<b class="tag">★ Must-have</b>':''}${tags.includes('25')?'<b class="tag">25 fps</b>':''}${tags.includes('50')?'<b class="tag">50 fps</b>':''}</span>`;label.querySelector('input').onchange=e=>{state[id]=e.target.checked;localStorage.setItem(key,JSON.stringify(state));label.classList.toggle('done',e.target.checked);update()};s.append(label)});list.append(s)});
function update(){const checks=[...document.querySelectorAll('.shot input')], done=checks.filter(x=>x.checked).length;document.querySelector('#count').textContent=`${done} / ${checks.length} shots`;document.querySelector('#bar').max=checks.length;document.querySelector('#bar').value=done}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.shot').forEach(x=>x.classList.toggle('hidden',b.dataset.filter!=='all'&&!x.dataset.tags.includes(b.dataset.filter)))});
document.querySelector('#reset').onclick=()=>{if(confirm('Alle vinkjes wissen?')){localStorage.removeItem(key);location.reload()}};update();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
